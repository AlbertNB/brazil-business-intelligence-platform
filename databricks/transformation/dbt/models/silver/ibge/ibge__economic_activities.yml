version: 2

models:
  - name: ibge__economic_activities
    description: "Curated CNAE economic activity subclasses from IBGE (silver layer), with full hierarchy flattened: subclass → class → group → division → section."
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "length(economic_activity_id) = 7"
    columns:
      - name: section_id
        description: "CNAE section identifier."
        tests: [not_null]

      - name: section_description
        description: "CNAE section description."
        tests: [not_null]

      - name: division_id
        description: "CNAE division identifier."
        tests: [not_null]

      - name: division_description
        description: "CNAE division description."
        tests: [not_null]

      - name: group_id
        description: "CNAE group identifier."
        tests: [not_null]

      - name: group_description
        description: "CNAE group description."
        tests: [not_null]

      - name: class_id
        description: "CNAE class identifier."
        tests: [not_null]

      - name: class_description
        description: "CNAE class description."
        tests: [not_null]

      - name: economic_activity_id
        description: "CNAE subclass identifier (natural key)."
        tests: [not_null, unique]

      - name: economic_activity_description
        description: "CNAE subclass description."
        tests: [not_null]

      - name: class_notes
        description: "Array of notes associated with the CNAE class."

      - name: economic_activity_details
        description: "Array of CNAE subclass activity descriptions."

      - name: economic_activity_notes
        description: "Array of notes associated with the CNAE subclass."

      - name: _extraction_ts
        description: "Extraction timestamp from the source API."
        tests: [not_null]

      - name: _ingestion_ts
        description: "Ingestion timestamp from Bronze."
        tests: [not_null]

      - name: _load_ts
        description: "Timestamp when this model row was loaded."
        tests: [not_null]
