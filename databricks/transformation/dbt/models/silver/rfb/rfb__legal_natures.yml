version: 2

models:
  - name: rfb__legal_natures
    description: >
      Reference table of Brazilian legal natures (natureza jurídica) from RFB (silver layer).
      Full refresh. Deduplicated by legal_nature_code.
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: length(legal_nature_code) = 4
    columns:
      - name: legal_nature_code
        description: "Legal nature code (4 digits). Natural key."
        tests: [not_null, unique]

      - name: legal_nature_description
        description: "Official legal nature description."
        tests: [not_null]

      - name: _reference_month
        description: "Reference month of the RFB extract (YYYY-MM)."
        tests: [not_null]

      - name: _ingestion_ts
        description: "Ingestion timestamp from Bronze."
        tests: [not_null]

      - name: _load_ts
        description: "Timestamp when this model row was loaded."
        tests: [not_null]
