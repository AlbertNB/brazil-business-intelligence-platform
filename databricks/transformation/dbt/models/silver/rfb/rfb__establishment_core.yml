version: 2

models:
  - name: rfb__establishment_core
    description: >
      Core establishment data (CNPJ completo) from RFB (silver layer).
      Maintains snapshot history by _reference_month.
      Partitioned by _reference_month in Databricks.
      Each row is one establishment snapshot identified by its full 14-digit CNPJ plus _reference_month.
      Merged incrementally.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cnpj_id, _reference_month]
      - dbt_utils.expression_is_true:
          arguments:
            expression: length(cnpj_id) = 14
      - dbt_utils.expression_is_true:
          arguments:
            expression: cnpj_id = concat(company_root_id, establishment_order, establishment_check_digit)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "{{ rfb_cnpj_dv_is_valid('cnpj_id') }}"
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          arguments:
            expression: length(establishment_order) = 4
      - dbt_utils.expression_is_true:
          arguments:
            expression: length(establishment_check_digit) = 2
      - dbt_utils.expression_is_true:
          arguments:
            expression: length(company_root_id) = 8
    columns:
      - name: cnpj_id
        description: "Full 14-digit CNPJ (company_root_id + establishment_order + establishment_check_digit). Business key repeated across monthly snapshots."
        tests:
          - not_null

      - name: company_root_id
        description: "Company root CNPJ (8 digits)."
        tests:
          - not_null

      - name: establishment_order
        description: "Establishment order (4 digits)."
        tests:
          - not_null

      - name: establishment_check_digit
        description: "Establishment check digit (2 digits)."
        tests:
          - not_null

      - name: establishment_type_id
        description: "Establishment type code (1=HEADQUARTERS, 2=BRANCH)."
        tests:
          - not_null

      - name: establishment_type_description
        description: "Establishment type label in uppercase (HEADQUARTERS, BRANCH)."
        tests:
          - not_null

      - name: trade_name
        description: "Trade name (nome fantasia) of the establishment."

      - name: registration_status_id
        description: "Registration status code (01=NULL_REGISTRATION, 02=ACTIVE, 03=SUSPENDED, 04=UNFIT, 08=CLOSED)."
        tests:
          - not_null

      - name: registration_status_description
        description: "Registration status label in uppercase (NULL_REGISTRATION, ACTIVE, SUSPENDED, UNFIT, CLOSED)."
        tests:
          - not_null

      - name: registration_status_date
        description: "Date of the current registration status (date)."

      - name: registration_status_reason_code
        description: "Reason code for the registration status. FK to rfb__registration_status_reasons."

      - name: activity_start_date
        description: "Date the establishment started its economic activities (date)."

      - name: main_cnae_code
        description: "Main CNAE economic activity code for the establishment."

      - name: special_status
        description: "Special status description, when applicable."

      - name: special_status_date
        description: "Date of the special status, when applicable (date)."

      - name: _reference_month
        description: "Reference month of the RFB extract (YYYY-MM)."
        tests: [not_null]

      - name: _ingestion_ts
        description: "Ingestion timestamp from Bronze."
        tests: [not_null]

      - name: _load_ts
        description: "Timestamp when this model row was loaded."
        tests: [not_null]
