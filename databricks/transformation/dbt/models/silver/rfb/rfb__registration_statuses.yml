version: 2

models:
  - name: rfb__registration_statuses
    description: >
      Reference table of establishment registration statuses derived from the latest RFB establishment snapshot (silver layer).
      Full refresh. Deduplicated by registration_status_id.
    columns:
      - name: registration_status_id
        description: "Registration status code. Natural key."
        tests:
          - not_null
          - unique

      - name: registration_status_description
        description: "Official description of the registration status."
        tests:
          - not_null

      - name: _reference_month
        description: "Reference month of the RFB extract (YYYY-MM)."
        tests: [not_null]

      - name: _ingestion_ts
        description: "Ingestion timestamp from Silver transactional source."
        tests: [not_null]

      - name: _load_ts
        description: "Timestamp when this model row was loaded."
        tests: [not_null]
