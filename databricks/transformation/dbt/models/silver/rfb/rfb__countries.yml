version: 2

models:
  - name: rfb__countries
    description: >
      Reference table of countries as coded by RFB (silver layer).
      Full refresh. Deduplicated by country_code.
    columns:
      - name: country_code
        description: "RFB country code. Natural key."
        tests: [not_null, unique]

      - name: country_name
        description: "Country name as used in the CNPJ dataset."
        tests: [not_null]

      - name: _reference_month
        description: "Reference month of the RFB extract (YYYY-MM)."
        tests: [not_null]

      - name: _ingestion_ts
        description: "Ingestion timestamp from Bronze."
        tests: [not_null]

      - name: _load_ts
        description: "Timestamp when this model row was loaded."
        tests: [not_null]
