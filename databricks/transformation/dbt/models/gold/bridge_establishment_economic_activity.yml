version: 2

models:
  - name: bridge_establishment_economic_activity
    description: "Gold bridge between establishments and economic activities for the latest RFB snapshot, deduplicating overlaps between primary and secondary CNAEs."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [establishment_sk, economic_activity_sk]
    columns:
      - name: establishment_sk
        description: "Surrogate key of the establishment (FK to dim_establishment)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_establishment')
              field: establishment_sk

      - name: economic_activity_sk
        description: "Surrogate key of the economic activity/CNAE (FK to dim_economic_activity)."
        tests:
          - not_null
          - relationships:
              to: ref('dim_economic_activity')
              field: economic_activity_sk

      - name: activity_type
        description: "Whether this CNAE is the establishment's main or secondary activity (main / secondary)."
        tests:
          - not_null
          - accepted_values:
              values: ['main', 'secondary']

      - name: is_main_activity
        description: "Boolean flag: true when this is the primary CNAE for the establishment."
        tests: [not_null]

      - name: _updated_at
        description: "Timestamp when this row was last written to the gold table."
        tests: [not_null]
