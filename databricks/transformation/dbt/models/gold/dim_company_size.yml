version: 2

models:
  - name: dim_company_size
    description: "Gold dimension of company size codes sourced from the dedicated Silver business registry reference model."
    columns:
      - name: company_size_sk
        description: "Deterministic surrogate key generated from company_size_nk."
        tests: [not_null, unique]

      - name: company_size_nk
        description: "Natural key — RFB company size code (e.g. 01 = micro, 03 = small, 05 = other)."
        tests: [not_null, unique]

      - name: company_size_description
        description: "Human-readable label for the company size tier."
        tests: [not_null]

      - name: _updated_at
        description: "Timestamp when this row was last written to the gold table."
        tests: [not_null]
