version: 2

models:
  - name: dim_legal_nature
    description: "Gold dimension of RFB legal natures."
    columns:
      - name: legal_nature_sk
        description: "Deterministic surrogate key generated from legal_nature_nk."
        tests: [not_null, unique]

      - name: legal_nature_nk
        description: "Natural key — RFB legal nature code (4-digit numeric string)."
        tests: [not_null, unique]

      - name: legal_nature_description
        description: "Human-readable legal nature description (e.g., Sociedade Empresária Limitada)."
        tests: [not_null]

      - name: _updated_at
        description: "Timestamp when this row was last written to the gold table."
        tests: [not_null]
