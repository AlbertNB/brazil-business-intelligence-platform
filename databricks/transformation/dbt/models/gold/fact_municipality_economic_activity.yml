version: 2

models:
  - name: fact_municipality_economic_activity
    description: "Latest-snapshot fact table aggregated by municipality, economic activity, activity type (main / secondary), and active status, providing establishment counts broken down by operational and tax regime flags."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [location_sk, economic_activity_sk, is_main_activity, is_active]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "establishments_count > 0"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "headquarter_count + branch_count = establishments_count"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "simples_count >= 0 and simples_count <= establishments_count"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "mei_count >= 0 and mei_count <= simples_count"
    columns:
      - name: location_sk
        description: "Surrogate key of the municipality (FK to dim_location). Part of the composite grain."
        tests:
          - not_null
          - relationships:
              to: ref('dim_location')
              field: location_sk

      - name: economic_activity_sk
        description: "Surrogate key of the CNAE economic activity (FK to dim_economic_activity). Part of the composite grain."
        tests:
          - not_null
          - relationships:
              to: ref('dim_economic_activity')
              field: economic_activity_sk

      - name: is_main_activity
        description: "Boolean flag: true when this CNAE is the establishments' primary activity; false for secondary. Part of the composite grain."
        tests: [not_null]

      - name: is_active
        description: "Boolean flag: true for active establishments (registration status 02), false otherwise. Part of the composite grain."
        tests: [not_null]

      - name: establishments_count
        description: "Number of establishments for this location / CNAE / activity type / active status combination."

      - name: headquarter_count
        description: "Number of headquarters establishments (Matriz) for this group."

      - name: branch_count
        description: "Number of branch establishments (Filial) for this group."

      - name: simples_count
        description: "Number of establishments whose parent company is enrolled in Simples Nacional for this group."

      - name: mei_count
        description: "Number of establishments whose parent company is registered as MEI for this group."

      - name: _reference_month
        description: "Most recent reference month among the source establishment records for this group."
        tests: [not_null]

      - name: _updated_at
        description: "Timestamp when this row was last written to the gold table."
        tests: [not_null]
