resources:
  jobs:
    business_transform:
      name: Business Transform
      tasks:
        - task_key: gold_load
          environment_key: Default
          dbt_task:
            project_directory: ../transformation/dbt
            warehouse_id: ${var.DBT_WAREHOUSE_ID}
            catalog: ${var.DBT_CATALOG}
            commands:
              - dbt deps
              - dbt run --select tag:gold
              - dbt test --select tag:gold
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            dependencies:
              - dbt-core==1.11.2
              - dbt-databricks==1.11.4
            environment_version: "5"
      performance_target: PERFORMANCE_OPTIMIZED
