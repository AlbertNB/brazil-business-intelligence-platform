name: dbt Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-core
        run: pip install dbt-core==1.11.2

      - name: Generate dbt docs
        working-directory: databricks/transformation/dbt
        run: |
          dbt deps
          dbt docs generate --empty-catalog --no-compile

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: databricks/transformation/dbt/target

  deploy:
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
